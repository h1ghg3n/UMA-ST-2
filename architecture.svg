<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">UmaCircle V1 Architecture</title>
  <desc id="desc">Discord-first modular monolith with application transaction boundary, SQLAlchemy, MariaDB, and separate maintenance tooling.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 32px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .subtitle { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .box { fill: #f9fafb; stroke: #374151; stroke-width: 2; rx: 14; }
      .box-main { fill: #f3f4f6; stroke: #111827; stroke-width: 2.5; rx: 14; }
      .box-db { fill: #f8fafc; stroke: #1f2937; stroke-width: 2.5; rx: 14; }
      .box-legacy { fill: #fafafa; stroke: #9ca3af; stroke-width: 2; stroke-dasharray: 8 6; rx: 14; }
      .label { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .body { font: 400 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #374151; }
      .small { font: 400 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .warn { font: 700 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6b7280; }
      .line { stroke: #4b5563; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #9ca3af; stroke-width: 2.2; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrowDash); }
      .divider { stroke: #e5e7eb; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="900"/>
  <text class="title" x="640" y="55" text-anchor="middle">UmaCircle V1 Architecture</text>
  <text class="subtitle" x="640" y="82" text-anchor="middle">Public maintenance/v1 runtime and maintenance boundaries</text>

  <!-- Users / Discord -->
  <rect class="box" x="70" y="135" width="230" height="105"/>
  <text class="label" x="185" y="170" text-anchor="middle">Discord</text>
  <text class="body" x="185" y="197" text-anchor="middle">Users / operators</text>
  <text class="small" x="185" y="219" text-anchor="middle">slash commands · interactions</text>

  <!-- Discord runtime -->
  <rect class="box-main" x="390" y="115" width="300" height="145"/>
  <text class="label" x="540" y="150" text-anchor="middle">Discord Runtime</text>
  <text class="body" x="540" y="178" text-anchor="middle">bot.py + Discord command/adapters</text>
  <line class="divider" x1="420" y1="195" x2="660" y2="195"/>
  <text class="small" x="540" y="220" text-anchor="middle">Account · Match · WIN5 · Settings</text>
  <text class="small" x="540" y="241" text-anchor="middle">Staff · Export · Publication</text>

  <!-- Application boundary -->
  <rect class="box-main" x="390" y="330" width="300" height="150"/>
  <text class="label" x="540" y="366" text-anchor="middle">Application Boundary</text>
  <text class="body" x="540" y="394" text-anchor="middle">command / query runners</text>
  <line class="divider" x1="420" y1="410" x2="660" y2="410"/>
  <text class="small" x="540" y="435" text-anchor="middle">transaction semantics</text>
  <text class="small" x="540" y="456" text-anchor="middle">operation-scoped Session</text>

  <!-- Domain/services -->
  <rect class="box" x="780" y="320" width="325" height="170"/>
  <text class="label" x="942.5" y="356" text-anchor="middle">Domain &amp; Service Logic</text>
  <text class="body" x="942.5" y="384" text-anchor="middle">Identity · Point · Match · Rating · WIN5</text>
  <line class="divider" x1="815" y1="402" x2="1070" y2="402"/>
  <text class="small" x="942.5" y="427" text-anchor="middle">business rules and orchestration</text>
  <text class="small" x="942.5" y="448" text-anchor="middle">mixed transitional V1 structure</text>
  <text class="small" x="942.5" y="469" text-anchor="middle">services/ + domain/</text>

  <!-- SQLAlchemy -->
  <rect class="box" x="390" y="565" width="300" height="115"/>
  <text class="label" x="540" y="600" text-anchor="middle">SQLAlchemy Persistence</text>
  <text class="body" x="540" y="627" text-anchor="middle">ORM · repositories · locks</text>
  <text class="small" x="540" y="651" text-anchor="middle">process-scoped Engine / pool</text>

  <!-- MariaDB -->
  <rect class="box-db" x="390" y="755" width="300" height="105"/>
  <text class="label" x="540" y="791" text-anchor="middle">MariaDB</text>
  <text class="body" x="540" y="819" text-anchor="middle">authoritative live datastore</text>
  <text class="small" x="540" y="841" text-anchor="middle">persistent Docker volume</text>

  <!-- Maintenance tools -->
  <rect class="box-legacy" x="70" y="550" width="245" height="200"/>
  <text class="label" x="192.5" y="585" text-anchor="middle">Maintenance CLI</text>
  <text class="body" x="192.5" y="613" text-anchor="middle">scripts/ · sheets/ · rebuild tools</text>
  <line class="divider" x1="100" y1="630" x2="285" y2="630"/>
  <text class="small" x="192.5" y="656" text-anchor="middle">import / export</text>
  <text class="small" x="192.5" y="678" text-anchor="middle">migration / backfill</text>
  <text class="small" x="192.5" y="700" text-anchor="middle">rebuild / reconciliation</text>
  <text class="warn" x="192.5" y="728" text-anchor="middle">maintenance-only</text>

  <!-- Replay legacy -->
  <rect class="box-legacy" x="805" y="575" width="350" height="180"/>
  <text class="label" x="980" y="610" text-anchor="middle">Legacy Replay / Recovery Paths</text>
  <text class="body" x="980" y="639" text-anchor="middle">historical manifests · bounded replay</text>
  <line class="divider" x1="840" y1="656" x2="1120" y2="656"/>
  <text class="small" x="980" y="681" text-anchor="middle">some lanes are superseded or rehearsal-only</text>
  <text class="small" x="980" y="703" text-anchor="middle">narrow prerequisites; not a general runtime API</text>
  <text class="warn" x="980" y="731" text-anchor="middle">not recommended for normal public use</text>

  <!-- Docker boundary -->
  <rect x="350" y="95" width="800" height="785" rx="22" fill="none" stroke="#d1d5db" stroke-width="2"/>
  <text class="small" x="1130" y="118" text-anchor="end">Docker Compose deployment</text>

  <!-- Arrows -->
  <path class="line" d="M 300 188 L 390 188"/>
  <path class="line" d="M 540 260 L 540 330"/>
  <path class="line" d="M 690 405 L 780 405"/>
  <path class="line" d="M 540 480 L 540 565"/>
  <path class="line" d="M 540 680 L 540 755"/>

  <!-- Domain/service to persistence -->
  <path class="line" d="M 942 490 C 942 540, 720 600, 690 610"/>

  <!-- Maintenance paths -->
  <path class="dash" d="M 315 635 C 350 635, 360 625, 390 625"/>
  <path class="dash" d="M 315 705 C 355 730, 365 785, 390 805"/>
  <path class="dash" d="M 805 670 C 755 670, 725 640, 690 625"/>

  <!-- Notes -->
  <text class="small" x="70" y="820">Solid arrows: normal runtime path</text>
  <text class="small" x="70" y="843">Dashed arrows: maintenance / legacy recovery paths</text>
</svg>
