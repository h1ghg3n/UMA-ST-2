services:
  mariadb-test:
    image: mariadb:11.4.7
    environment:
      MARIADB_DATABASE: uma_st2_integration_test
      MARIADB_USER: uma_st2_integration
      MARIADB_PASSWORD: integration-test-only
      MARIADB_ROOT_PASSWORD: integration-root-test-only
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_ALL_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql

  integration-test:
    build:
      context: .
      dockerfile: Dockerfile.integration
    depends_on:
      mariadb-test:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://uma_st2_integration:integration-test-only@mariadb-test:3306/uma_st2_integration_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://uma_st2_integration:integration-test-only@mariadb-test:3306/uma_st2_integration_test?charset=utf8mb4
    command:
      - /bin/sh
      - -eu
      - -c
      - |
        python -m ruff format --check alembic
        python -m ruff check alembic
        python -m alembic upgrade head
        python -m alembic check
        python -m pytest -q -m "integration and not historical"
