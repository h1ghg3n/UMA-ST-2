services:
  bot:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DISCORD_TOKEN_FILE: /run/secrets/discord_token
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?set DISCORD_GUILD_ID}
      DISCORD_ADMIN_CHANNEL_IDS: ${DISCORD_ADMIN_CHANNEL_IDS:-}
      OWNER_ROLE_ID: ${OWNER_ROLE_ID:-0}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Seoul}
      APP_UTC_OFFSET_MINUTES: ${APP_UTC_OFFSET_MINUTES:-540}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_LEGACY_PLAYER_LINK: ${ENABLE_LEGACY_PLAYER_LINK:-false}
      DEFAULT_MATCH_POINTS: ${DEFAULT_MATCH_POINTS:-500}
      MIN_MATCH_BET_AMOUNT: ${MIN_MATCH_BET_AMOUNT:-10}
      MAX_MATCH_BET_AMOUNT: ${MAX_MATCH_BET_AMOUNT:-21474836470}
      BET_CLOSE_MINUTES: ${BET_CLOSE_MINUTES:-30}
      EXPORT_DIR: ${EXPORT_DIR:-/app/exports}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
    depends_on:
      mariadb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./exports:/app/exports
      - ./backups:/app/backups
      - ./data:/app/data
    secrets:
      - discord_token
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    restart: unless-stopped

  migrate:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["umacircle-safe-migrate"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: "no"

  mariadb:
    image: mariadb:11.4.7
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER:?set MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=STRICT_ALL_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  mariadb-data:

secrets:
  discord_token:
    file: ./secrets/discord_token
