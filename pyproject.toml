[project]
name = "uma-st-2"
version = "2.0.0b2"
description = "UMA-ST-2 Discord bot and data platform for Umamusume circle events"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "cryptography>=42,<46",
    "discord.py>=2.7,<2.8",
    "openpyxl>=3.1,<4",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "pymysql>=1.1,<2",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
]

[project.scripts]
uma-st-2 = "uma_st2.entrypoint:main"
uma-st-2-provision-discord = "uma_st2.guild_provisioning_entrypoint:main"
uma-st-2-reconcile-publications = "uma_st2.publication_reconciliation_entrypoint:main"
uma-st-2-seed-master-data = "uma_st2.master_data_seed_entrypoint:main"
uma-st-2-seed-rating-rules = "uma_st2.rating_rule_seed_entrypoint:main"
uma-st-2-export-win5 = "uma_st2.win5_export_entrypoint:main"
[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff==0.16.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
