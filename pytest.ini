[pytest]
minversion = 8.0
testpaths = tests
pythonpath = src
addopts = -p no:cacheprovider --strict-config --strict-markers
tmp_path_retention_count = 0
tmp_path_retention_policy = none
filterwarnings =
    ignore:'count' is passed as positional argument:DeprecationWarning:discord\.utils
markers =
    integration: requires an isolated external service such as MariaDB
    historical: preserved historical migration or replay evidence
    jetson: requires the exact-image disposable-clone Jetson contract
